name: devcontainer image

# Builds .devcontainer/Dockerfile, smoke-tests every tool in it, and only then
# publishes it to ghcr.io/raulbehl/open-source-eda. main publishes :latest
# (what devcontainer.json uses); other branches publish :<branch> for testing.

on:
  push:
    branches: ['**']
    paths:
      - '.devcontainer/**'
      - '.github/workflows/devcontainer-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          sha="${IMAGE}:sha-${GITHUB_SHA::7}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "tags=${IMAGE}:latest,${sha}" >> "$GITHUB_OUTPUT"
          else
            branch=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
            echo "tags=${IMAGE}:${branch},${sha}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          load: true
          tags: open-source-eda:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (as the codespace user)
        run: |
          docker run --rm -v "$PWD:/src:ro" -u vscode open-source-eda:test \
            bash -c 'cp -r /src /tmp/repo && bash /tmp/repo/.devcontainer/smoke/run.sh'

      - name: Image size
        run: docker image ls open-source-eda:test

      - name: Publish
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Open Source EDA Season One toolchain
          cache-from: type=gha
